name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from source
        run: python -m pip install -e . build
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Scripted repair demo
        run: python examples/offline_demo.py
      - name: Release content scan
        run: python scripts/check_release.py
      - name: Build distributions
        run: python -m build
      - name: Install and smoke-test wheel outside the source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/patchpilot-wheel"
          "$RUNNER_TEMP/patchpilot-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/patchpilot-wheel/bin/patchpilot" --help
