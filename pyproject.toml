[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.5.0"
description = "A minimal, traceable code-repair agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PatchPilot contributors" }]
dependencies = [
    "python-dotenv>=1.0,<2",
]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]
